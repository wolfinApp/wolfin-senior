name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hook and skill tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate the plugin and marketplace manifests
        env:
          CLAUDE_CODE_VERSION: "2.1.323"
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate . --strict
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate .claude-plugin/plugin.json --strict
